[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-research-platform"
version = "0.1.0"
description = "Research-first quantitative trading platform for Indian equities"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "python-dateutil",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]
# Official Angel One SDK + its documented companions; needed only for live use.
smartapi = ["smartapi-python", "pyotp", "logzero", "websocket-client",
            "pycryptodome"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
